name: Deploy to GitHub Pages

# Clemistry is a static site — index.html plus css/ and js/ — so there is
# nothing to build. The whole repository root is uploaded as the Pages artifact.

on:
  push:
    branches:
      - main
      - claude/chemistry-simulation-game-wlsy54
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement turns Pages on for the repository if it is not already,
        # so this needs no manual step in the repository settings.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
